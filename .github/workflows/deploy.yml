name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Picks up Spotify-side playlist changes (new/renamed/deleted) even with no commits.
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the version used locally, and stays ahead of what the
          # dependencies ask for: @supabase/auth-js declares node >=22, which
          # on 20 made npm ci warn on every run. Nothing here executes that
          # package — it is browser code that Vite bundles with its own parser
          # — but 20 reached end of life in April 2026 either way.
          node-version: 24
          cache: npm
      - run: npm ci
      # Before the Spotify fetch rather than after: a run that is going to
      # fail may as well fail without having spent quota on the way. Now that
      # the repo carries row-level-security logic and the code that talks to
      # it, shipping past a red test is not a thing to leave possible.
      - run: npm run lint
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: |
            data/track-counts-cache.json
            data/last-successful-playlists.json
          # Unique key per run so the updated cache actually gets saved back at
          # the end (cache keys are immutable — a fixed key would only ever
          # save once); restore-keys falls back to the most recent entry.
          key: spotify-cache-${{ github.run_id }}
          restore-keys: |
            spotify-cache-
      - run: npm run fetch:playlists
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          # Only the daily cron and the admin's manual "Rafraîchir le site
          # maintenant" button (workflow_dispatch) actually call Spotify; a
          # plain code push reuses the cached playlist list to save quota.
          SKIP_LIVE_FETCH: ${{ github.event_name == 'push' && 'true' || 'false' }}
      # A free Supabase project pauses after a week with no database activity,
      # and the site would then stop showing vote counts. Visitors are the real
      # keep-alive now that every page load reads them; this is the floor for a
      # week with none. It only uses the anon key, already public in the bundle,
      # so there is nothing to keep secret. -f so a broken key or an already
      # paused project shows up red rather than passing quietly, and
      # continue-on-error so Supabase being down never blocks a deploy.
      - name: Keep the Supabase project awake
        continue-on-error: true
        run: |
          curl -fsS "${SUPABASE_URL}/rest/v1/playlist_upvote_counts?select=playlist_id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" > /dev/null
        env:
          SUPABASE_URL: https://hvfzgrtfcikamyssbipc.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2ZnpncnRmY2lrYW15c3NiaXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NzQwNTUsImV4cCI6MjEwNDA1MDA1NX0.aoXH9a2TRXu90kbLLPw2-RtpU3oE66aks67Ztht7Wvs
      - run: npm run build
      # Guards what the build makes of the CSS, which is not what src/ says.
      # Lightning CSS rewrites media queries to whatever build.cssTarget can
      # read, and at its default target that means the Media Queries 4 range
      # form: `@media (width <= 700px)`. Safari learned that in 16.4, and a
      # browser that cannot parse a media query drops the block whole — so an
      # older phone silently loses every breakpoint and gets the desktop grid
      # on a 390px screen. Nothing in src/ looks wrong when that happens and
      # no test catches it, which is why the check reads the shipped file.
      # See build.cssTarget in vite.config.ts for the fix it protects.
      - name: No range-syntax media queries in the shipped CSS
        run: |
          if grep -rEo '@media [^{]*[<>]' dist/assets/*.css; then
            echo "::error::Breakpoints above were shipped in range syntax; browsers older than Safari 16.4 will drop them. Check build.cssTarget in vite.config.ts."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
